[pytest]
testpaths = tests
pythonpath = .
addopts = -v --html=reports/test-report.html --self-contained-html --css=tests/report.css
log_cli = true
log_cli_level = INFO
log_file = reports/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)-7s %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
log_level = INFO
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
render_collapsed = passed
initial_sort = original
